services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm_saas_test
      POSTGRES_USER: crm_saas_test
      POSTGRES_PASSWORD: crm_saas_test
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_saas_test -d crm_saas_test"]
      interval: 5s
      timeout: 3s
      retries: 20
